[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mrta"
version = "0.0.0"
description = "LLM-Based Disaster Mission Decomposition and CBBA Task Allocation for Heterogeneous Unmanned Systems"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
llm = [
    "openai>=1.40",
]
viz = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = [
    "core*", "scenarios*", "validator*", "allocation*", "execution*", "llm*",
    "evaluation*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
