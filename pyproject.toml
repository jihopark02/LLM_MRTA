[build-system]
# setuptools' stable PEP 660 editable-install support starts at 64.  Keeping
# the lower bound below that lets pip create a build environment whose backend
# has no build_editable hook, even though this project documents `pip -e`.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mrta"
version = "0.0.0"
description = "LLM-Based Disaster Mission Decomposition and CBBA Task Allocation for Heterogeneous Unmanned Systems"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
llm = [
    "openai>=1.40",
]
viz = [
    "matplotlib>=3.7",
]
demo = [
    "streamlit>=1.37",
]
desktop = [
    "PySide6>=6.7,<7",
    "openai>=1.40",
]

[tool.setuptools.packages.find]
include = [
    "core*", "scenarios*", "validator*", "allocation*", "execution*", "llm*",
    "evaluation*", "interaction*", "demo*", "desktop*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
