# Canonical full-response reference graph (RESEARCH_CONTRACT.md §3 fixed shape,
# §12 Family A). Hand-authored; used by P1-P4 before the LLM is in the loop.
#
# Fixed shape (contract §3, D-061): 8 tasks, 2 edges, computed initial READY 6,
# initial PENDING 2. READY/PENDING are NOT written here — they are recomputed
# from predecessor state (core/task_graph.py).
#
# priority is NOT written here — it is scene-derived by the compiler (D-022):
# incident tasks inherit the incident priority (FIRE_SITE_1 9 / FIRE_SITE_2 7),
# AREA_RECON gets AREA_RECON_PRIORITY (4).
#
# Edge endpoints are "TASK_TYPE:target"; task_id is "TASK_TYPE__target".

fixture_id: family_a_full_response
scene: industrial_park

tasks:
  - { type: AREA_RECON,          target: ZONE_A }
  - { type: AREA_RECON,          target: ZONE_B }
  - { type: AREA_RECON,          target: ZONE_C }
  - { type: AREA_RECON,          target: ZONE_D }

  - { type: GROUND_INSPECTION,   target: FIRE_SITE_1 }
  - { type: GROUND_SUPPRESSION,  target: FIRE_SITE_1 }

  - { type: GROUND_INSPECTION,   target: FIRE_SITE_2 }
  - { type: GROUND_SUPPRESSION,  target: FIRE_SITE_2 }

edges:
  - [GROUND_INSPECTION:FIRE_SITE_1, GROUND_SUPPRESSION:FIRE_SITE_1]
  - [GROUND_INSPECTION:FIRE_SITE_2, GROUND_SUPPRESSION:FIRE_SITE_2]
