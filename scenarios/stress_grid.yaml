# D-074 Stress-S evaluation scene. NOT a phase gate, NOT a demo profile — it
# exists only for the single-call vs two-stage graph-generation ablation
# (RESEARCH_CONTRACT.md §12, D-074).
#
# Same 15-zone geometry / route network / fleet as the demo_grid presentation
# scene, but with four KNOWN incidents (spread across the district) instead of a
# latent field, so the ablation can score incident-workflow graphs against a
# fixed reference. Bare letter display labels; internal ids unchanged.

