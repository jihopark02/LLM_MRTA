# P12 public patrol scene. It intentionally contains no known incidents.
# The simulated FIRE_DETECTED condition lives in a separate strict fixture and
# is not included in Scene, scene_hash, the initial graph, or any LLM context.

scene_id: patrol_park

zones:
  ZONE_A:
    name: Warehouse
    recon_waypoint: [30.0, 180.0]
    reported_incident_position: [32.0, 172.0]
    reported_incident_access_node: R_A
  ZONE_B:
    name: Processing Area
    recon_waypoint: [120.0, 115.0]
    reported_incident_position: [118.0, 118.0]
    reported_incident_access_node: R_B
  ZONE_C:
    name: Utility Yard
    recon_waypoint: [30.0, 40.0]
    reported_incident_position: [34.0, 44.0]
    reported_incident_access_node: R_C
  ZONE_D:
    name: Tank Farm
    recon_waypoint: [200.0, 45.0]
    reported_incident_position: [196.0, 50.0]
    reported_incident_access_node: R_D

incidents: {}

route_graph:
  nodes:
    R_DEPOT: [10.0, 10.0]
    R_C:     [30.0, 40.0]
    R_A:     [30.0, 175.0]
    R_MID:   [110.0, 60.0]
    R_B:     [125.0, 112.0]
    R_D:     [200.0, 45.0]
  lanes:
    - [R_DEPOT, R_C]
    - [R_C, R_A]
    - [R_C, R_MID]
    - [R_MID, R_B]
    - [R_MID, R_D]

fleet:
  - { agent_id: S1, platform_kind: UAV, capabilities: [AERIAL_RECON, THERMAL_SENSOR],       position: [10.0, 10.0], speed: 8.0 }
  - { agent_id: S2, platform_kind: UAV, capabilities: [AERIAL_RECON, THERMAL_SENSOR],       position: [10.0, 10.0], speed: 8.0 }
  - { agent_id: R1, platform_kind: UAV, capabilities: [THERMAL_SENSOR, SUPPRESSANT_PAYLOAD], position: [10.0, 10.0], speed: 7.0 }
  - { agent_id: R2, platform_kind: UAV, capabilities: [THERMAL_SENSOR, SUPPRESSANT_PAYLOAD], position: [10.0, 10.0], speed: 7.0 }
  - { agent_id: G1, platform_kind: UGV, capabilities: [GROUND_MOBILITY, SUPPRESSANT_APPLICATOR], access_node: R_DEPOT, speed: 3.0 }
  - { agent_id: G2, platform_kind: UGV, capabilities: [GROUND_MOBILITY, SUPPRESSANT_APPLICATOR], access_node: R_C, speed: 3.0 }
