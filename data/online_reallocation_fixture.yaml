fixture_id: P9_REPRESENTATIVE_1
base_scene: scenarios/industrial_park.yaml

# Register three incidents before execution so both aerial and ground agents
# have queued (ASSIGNED) work at the chosen completion boundary.
initial_report_zones:
  - ZONE_C  # FIRE_SITE_3
  - ZONE_D  # FIRE_SITE_4
  - ZONE_A  # FIRE_SITE_5
initial_graph:
  area_recon_all_zones: true
  incident_workflow_up_to: GROUND_SUPPRESSION

# Pause immediately after the first deterministic completion event (D-061 fleet:
# by the 1st completion one AREA_RECON and three GROUND_INSPECTION are still
# ASSIGNED, so the two release policies can be told apart).
checkpoint_event: 1
expected_checkpoint:
  simulation_time: 44.50693909432999
  completed_now:
    - AREA_RECON__ZONE_C

# The online command is represented deterministically as REPORT + UPDATE.
online_report_zone: ZONE_B  # creates FIRE_SITE_6
online_update_up_to: GROUND_SUPPRESSION
expected_new_incident_id: FIRE_SITE_6

# Identification gate from contract §19.5. The new incident's GROUND_INSPECTION
# (UGV bidders) is bidder-connected to every unstarted ground assignment but not
# to the unstarted AREA_RECON (UAV): selective keeps ZONE_D, full-reset drops it.
expected_release:
  no-reset: []
  selective:
    - GROUND_INSPECTION__FIRE_SITE_2
    - GROUND_INSPECTION__FIRE_SITE_4
    - GROUND_INSPECTION__FIRE_SITE_5
  full-reset:
    - AREA_RECON__ZONE_D
    - GROUND_INSPECTION__FIRE_SITE_2
    - GROUND_INSPECTION__FIRE_SITE_4
    - GROUND_INSPECTION__FIRE_SITE_5
