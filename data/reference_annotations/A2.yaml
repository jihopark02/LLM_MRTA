# Canonical reference annotation — fixed BEFORE any LLM call (RESEARCH_CONTRACT.md
# §12, D-021, D-061). A `*_chain` is a contiguous prefix of the §4 workflow
# GROUND_INSPECTION -> GROUND_SUPPRESSION and expands to those tasks plus the
# sequential edges between them. AREA_RECON is not part of the chain.

id: A2
family: A
profile: FULL_RESPONSE
command: >-
  Full response to the industrial park emergency. Do aerial reconnaissance of
  ZONE_A, ZONE_B, ZONE_C and ZONE_D. For both FIRE_SITE_1 and FIRE_SITE_2,
  complete the whole ground sequence: the ground inspection, then the ground
  suppression.
rationale: >-
  Explicitly enumerates the two workflow steps and all four zones, so the
  target graph is the full response: AREA_RECON x4 plus GROUND_INSPECTION ->
  GROUND_SUPPRESSION for each incident. 8 tasks / 2 edges.
allowed_graphs:
  - recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
    incident_chains:
      FIRE_SITE_1: [GROUND_INSPECTION, GROUND_SUPPRESSION]
      FIRE_SITE_2: [GROUND_INSPECTION, GROUND_SUPPRESSION]
