# Canonical reference annotation — fixed BEFORE any LLM call (RESEARCH_CONTRACT.md
# §12, D-021, D-061). A `*_chain` is a contiguous prefix of the §4 workflow
# GROUND_INSPECTION -> GROUND_SUPPRESSION and expands to those tasks plus the
# sequential edges between them. AREA_RECON is not part of the chain.

id: B3
family: B
profile: AERIAL_ONLY
command: >-
  Reconnaissance phase only: survey every zone from the air. No ground
  inspection and no ground suppression until I say so.
rationale: >-
  Names the forbidden ground steps explicitly, leaving only AREA_RECON of all
  four zones. Same target graph as B1 / B2: 4 tasks, 0 edges.
allowed_graphs:
  - recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
    incident_chains: {}
