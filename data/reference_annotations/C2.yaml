# Canonical reference annotation — fixed BEFORE any LLM call (RESEARCH_CONTRACT.md
# §12, D-021, D-061). A `*_chain` is a contiguous prefix of the §4 workflow
# GROUND_INSPECTION -> GROUND_SUPPRESSION and expands to those tasks plus the
# sequential edges between them. AREA_RECON is not part of the chain.

id: C2
family: C
profile: SELECTIVE_RESPONSE
command: >-
  Escalate FIRE_SITE_2 to a complete ground suppression response - run the
  entire workflow there. FIRE_SITE_1 just needs a ground inspection for now.
  Survey every zone too.
rationale: >-
  Mirror image of C1: FIRE_SITE_2 gets the full two-step chain, FIRE_SITE_1
  gets only GROUND_INSPECTION, plus AREA_RECON of all four zones. 7 tasks, 1 edge.
allowed_graphs:
  - recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
    incident_chains:
      FIRE_SITE_1: [GROUND_INSPECTION]
      FIRE_SITE_2: [GROUND_INSPECTION, GROUND_SUPPRESSION]
