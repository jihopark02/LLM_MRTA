# Canonical reference annotation — fixed BEFORE any LLM call (RESEARCH_CONTRACT.md
# §12, D-021, D-061). A `*_chain` is a contiguous prefix of the §4 workflow
# GROUND_INSPECTION -> GROUND_SUPPRESSION and expands to those tasks plus the
# sequential edges between them. AREA_RECON is not part of the chain.

id: B1
family: B
profile: AERIAL_ONLY
command: >-
  Aerial assessment only for now. Have the UAVs survey all four zones from
  the air. Do not send any ground units to the fire sites yet.
rationale: >-
  "Aerial assessment only" plus the explicit hold on ground units restricts
  the graph to AREA_RECON of all four zones. No incident tasks, no edges.
  One allowed graph: 4 tasks, 0 edges.
allowed_graphs:
  - recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
    incident_chains: {}
