# Canonical reference annotation — fixed BEFORE any LLM call (RESEARCH_CONTRACT.md
# §12, D-021, D-061). A `*_chain` is a contiguous prefix of the §4 workflow
# GROUND_INSPECTION -> GROUND_SUPPRESSION and expands to those tasks plus the
# sequential edges between them. AREA_RECON is not part of the chain.

id: A1
family: A
profile: FULL_RESPONSE
command: >-
  We have active fires at FIRE_SITE_1 and FIRE_SITE_2. Run a full disaster
  response: survey every zone from the air, and take each fire all the way
  through the ground response workflow from inspection to suppression.
rationale: >-
  "Full disaster response" on both reported incidents means the complete
  two-step ground workflow per incident (GROUND_INSPECTION -> GROUND_SUPPRESSION).
  "Survey every zone from the air" is AREA_RECON of all four zones. One allowed
  graph, identical to the P1 reference fixture (8 tasks / 2 edges).
allowed_graphs:
  - recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
    incident_chains:
      FIRE_SITE_1: [GROUND_INSPECTION, GROUND_SUPPRESSION]
      FIRE_SITE_2: [GROUND_INSPECTION, GROUND_SUPPRESSION]
