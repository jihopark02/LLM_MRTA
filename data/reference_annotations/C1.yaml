# Canonical reference annotation — fixed BEFORE any LLM call (RESEARCH_CONTRACT.md
# §12, D-021, D-061). A `*_chain` is a contiguous prefix of the §4 workflow
# GROUND_INSPECTION -> GROUND_SUPPRESSION and expands to those tasks plus the
# sequential edges between them. AREA_RECON is not part of the chain.

id: C1
family: C
profile: SELECTIVE_RESPONSE
command: >-
  FIRE_SITE_1 is the priority - take it through the full ground response to
  suppression. FIRE_SITE_2 only needs a ground inspection for now. Also survey
  all four zones from the air.
rationale: >-
  Asymmetric per-incident response: FIRE_SITE_1 gets the full two-step chain,
  FIRE_SITE_2 gets only the workflow head (GROUND_INSPECTION). Plus AREA_RECON of
  all four zones. 7 tasks, 1 edge.
allowed_graphs:
  - recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
    incident_chains:
      FIRE_SITE_1: [GROUND_INSPECTION, GROUND_SUPPRESSION]
      FIRE_SITE_2: [GROUND_INSPECTION]
