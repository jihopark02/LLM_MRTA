# Canonical reference annotation — fixed BEFORE any LLM call (RESEARCH_CONTRACT.md
# §12, D-021, D-061). A `*_chain` is a contiguous prefix of the §4 workflow
# GROUND_INSPECTION -> GROUND_SUPPRESSION and expands to those tasks plus the
# sequential edges between them. AREA_RECON is not part of the chain.

id: C3
family: C
profile: SELECTIVE_RESPONSE
command: >-
  Skip the zone surveys entirely. Put FIRE_SITE_1 through the whole ground
  response to suppression, and give FIRE_SITE_2 a ground inspection only.
rationale: >-
  "Skip the zone surveys entirely" removes all AREA_RECON tasks. FIRE_SITE_1
  gets the full two-step chain, FIRE_SITE_2 gets only GROUND_INSPECTION. 3 tasks,
  1 edge - the smallest reference in the set.
allowed_graphs:
  - recon_zones: []
    incident_chains:
      FIRE_SITE_1: [GROUND_INSPECTION, GROUND_SUPPRESSION]
      FIRE_SITE_2: [GROUND_INSPECTION]
