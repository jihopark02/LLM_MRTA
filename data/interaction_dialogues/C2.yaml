id: C2
family: C
profile: SELECTIVE_RESPONSE
shape: REPORT_UPDATE
rationale: 비대칭 초기 계획에 새 incident 전체 chain을 최근 referent로 추가한다.
turns:
  - input_kind: NATURAL_LANGUAGE
    utterance: 모든 구역을 정찰해. FIRE_SITE_2는 지상 진압까지 처리하고 FIRE_SITE_1은 열원만 확인해줘.
    intent: {kind: NEW_MISSION}
    outcome: COMMITTED
  - input_kind: NATURAL_LANGUAGE
    utterance: A 구역에 새 화재가 발생했어.
    intent: {kind: REPORT_INCIDENT, zone_ref: A 구역}
    outcome: COMMITTED
    grounding: {status: RESOLVED, entity_kind: zone, entity_id: ZONE_A, via: explicit}
  - input_kind: NATURAL_LANGUAGE
    utterance: 거기를 지상 진압까지 추가해줘.
    intent: {kind: UPDATE_MISSION, target_phrase: 거기, up_to_step: GROUND_SUPPRESSION}
    outcome: COMMITTED
    grounding: {status: RESOLVED, entity_kind: incident, entity_id: FIRE_SITE_3, via: referent}
    patch:
      accepted: true
      added_tasks: [THERMAL_RECON__FIRE_SITE_3, SUPPRESSANT_DROP__FIRE_SITE_3, GROUND_INSPECTION__FIRE_SITE_3, GROUND_SUPPRESSION__FIRE_SITE_3]
      added_edges:
        - [THERMAL_RECON__FIRE_SITE_3, SUPPRESSANT_DROP__FIRE_SITE_3]
        - [SUPPRESSANT_DROP__FIRE_SITE_3, GROUND_INSPECTION__FIRE_SITE_3]
        - [GROUND_INSPECTION__FIRE_SITE_3, GROUND_SUPPRESSION__FIRE_SITE_3]
      directly_released_tasks: []
  - input_kind: NATURAL_LANGUAGE
    utterance: 거기 대응 상태를 알려줘.
    intent: {kind: QUERY_STATUS, about: mission, target_phrase: 거기}
    outcome: ANSWERED
    grounding: {status: RESOLVED, entity_kind: incident, entity_id: FIRE_SITE_3, via: referent}
initial_graph:
  recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
  incident_chains:
    FIRE_SITE_1: [THERMAL_RECON]
    FIRE_SITE_2: [THERMAL_RECON, SUPPRESSANT_DROP, GROUND_INSPECTION, GROUND_SUPPRESSION]
final_graph:
  recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
  incident_chains:
    FIRE_SITE_1: [THERMAL_RECON]
    FIRE_SITE_2: [THERMAL_RECON, SUPPRESSANT_DROP, GROUND_INSPECTION, GROUND_SUPPRESSION]
    FIRE_SITE_3: [THERMAL_RECON, SUPPRESSANT_DROP, GROUND_INSPECTION, GROUND_SUPPRESSION]
