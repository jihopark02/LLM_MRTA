id: B4
family: B
profile: AERIAL_ONLY
shape: AMBIGUOUS_SELECTION
rationale: 모호한 화재를 후보 선택으로 확정한 뒤 aerial-only 초기 graph의 한 incident를 전체 chain으로 확장한다.
turns:
  - input_kind: NATURAL_LANGUAGE
    utterance: 전 구역을 항공 정찰만 해줘. 화재 대응은 아직 하지 마.
    intent: {kind: NEW_MISSION}
    outcome: COMMITTED
  - input_kind: NATURAL_LANGUAGE
    utterance: 그 화재는 지상 진압까지 확장해줘.
    intent: {kind: UPDATE_MISSION, target_phrase: 그 화재, up_to_step: GROUND_SUPPRESSION}
    outcome: CLARIFICATION
    grounding:
      status: CLARIFICATION_REQUIRED
      entity_kind: incident
      reason: AMBIGUOUS_ENTITY
      candidates: [FIRE_SITE_1, FIRE_SITE_2]
  - input_kind: CANDIDATE_SELECTION
    entity_id: FIRE_SITE_2
    outcome: COMMITTED
    grounding: {status: RESOLVED, entity_kind: incident, entity_id: FIRE_SITE_2, via: explicit}
    patch:
      accepted: true
      added_tasks: [GROUND_INSPECTION__FIRE_SITE_2, GROUND_SUPPRESSION__FIRE_SITE_2]
      added_edges:
        - [GROUND_INSPECTION__FIRE_SITE_2, GROUND_SUPPRESSION__FIRE_SITE_2]
      directly_released_tasks: []
initial_graph:
  recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
  incident_chains:
    FIRE_SITE_1: []
    FIRE_SITE_2: []
final_graph:
  recon_zones: [ZONE_A, ZONE_B, ZONE_C, ZONE_D]
  incident_chains:
    FIRE_SITE_1: []
    FIRE_SITE_2: [GROUND_INSPECTION, GROUND_SUPPRESSION]
