# D-076 eval-only fixture (S12): two fires at equal x, so an EASTMOST/WESTMOST
# spatial pick is a genuine tie -> fail-closed clarification.
# Semantic scene: ~220 m virtual industrial park, fire response.
# RESEARCH_CONTRACT.md §3, §5, §8.
#
# This file holds ONLY the environment + fleet vocabulary (zones, incidents,
# route graph, agents). Task instances are layered on top by a separate fixture
# file (scenarios/reference_fixture.yaml) so offline tests stay reproducible.

scene_id: tie_park

# `reported_incident_*` is the fixed response point for an incident the operator
# reports in this zone (contract §18.10): the UAV target position and the UGV
# route node are predefined here so the LLM never invents coordinates. Both are
# validated at scene load — the node must exist in the route graph and be
# reachable from every UGV start.
zones:
  ZONE_A:
    name: Warehouse
    recon_waypoint: [30.0, 180.0]
    reported_incident_position: [32.0, 172.0]
    reported_incident_access_node: R_A
  ZONE_B:
    name: Processing Area
    recon_waypoint: [120.0, 115.0]
    reported_incident_position: [118.0, 118.0]
    reported_incident_access_node: R_B
  ZONE_C:
    name: Utility Yard
    recon_waypoint: [30.0, 40.0]
    reported_incident_position: [34.0, 44.0]
    reported_incident_access_node: R_C
  ZONE_D:
    name: Tank Farm
    recon_waypoint: [200.0, 45.0]
    reported_incident_position: [196.0, 50.0]
    reported_incident_access_node: R_D

# Incidents are given as RESPONSE_REQUIRED by the scene; nothing in the system
# decides whether a fire exists (contract §3).
incidents:
  FIRE_SITE_1: { zone: ZONE_B, priority: 9, position: [150.0, 108.0], access_node: R_B, status: RESPONSE_REQUIRED }
  FIRE_SITE_2: { zone: ZONE_D, priority: 7, position: [150.0, 42.0], access_node: R_D, status: RESPONSE_REQUIRED }

# Predefined UGV lane/waypoint graph. Lane weight defaults to Euclidean node
# distance (see core/route_graph.py).
route_graph:
  nodes:
    R_DEPOT: [10.0, 10.0]
    R_C:     [30.0, 40.0]
    R_A:     [30.0, 175.0]
    R_MID:   [110.0, 60.0]
    R_B:     [125.0, 112.0]
    R_D:     [200.0, 45.0]
  lanes:
    - [R_DEPOT, R_C]
    - [R_C, R_A]
    - [R_C, R_MID]
    - [R_MID, R_B]
    - [R_MID, R_D]

# 5 agents: identical UAV x3 {AERIAL_RECON} + UGV x2 (§5, D-060/D-061).
fleet:
  - { agent_id: U1, platform_kind: UAV, capabilities: [AERIAL_RECON], position: [10.0, 10.0], speed: 8.0 }
  - { agent_id: U2, platform_kind: UAV, capabilities: [AERIAL_RECON], position: [10.0, 10.0], speed: 8.0 }
  - { agent_id: U3, platform_kind: UAV, capabilities: [AERIAL_RECON], position: [10.0, 10.0], speed: 8.0 }
  - { agent_id: G1, platform_kind: UGV, capabilities: [GROUND_MOBILITY, SUPPRESSANT_APPLICATOR],   access_node: R_DEPOT, speed: 3.0 }
  - { agent_id: G2, platform_kind: UGV, capabilities: [GROUND_MOBILITY, SUPPRESSANT_APPLICATOR],   access_node: R_C,     speed: 3.0 }
